<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>RecallDeck</title></head><body><main>
<header><h1>RecallDeck</h1><p>Remember, don't just reread.</p></header>
<section class="stats"><div><b id="due">0</b><small>Due</small></div><div><b id="learned">0</b><small>Learned</small></div><div><b id="streak">0</b><small>Streak</small></div><div><b id="accuracy">0%</b><small>Accuracy</small></div></section>
<nav><button data-tab="study" class="active">🧠 Study</button><button data-tab="cards">📚 Cards</button><button data-tab="add">＋ Add</button><button data-tab="progress">📊 Progress</button></nav>
<section id="study" class="page"><div class="studyControls"><label>Practice <select id="limit"><option value="5">5 cards</option><option value="10" selected>10 cards</option><option value="20">20 cards</option><option value="50">50 cards</option><option value="all">All due</option></select></label><label class="switch"><input type="checkbox" id="random" checked> 🔀 Random order</label><button id="startSession">Start session</button></div>
<div id="sessionInfo" class="sessionInfo hidden"><b id="sessionPos">0 / 0</b><span id="sessionMode"></span></div>
<div id="empty" class="empty hidden"><h2>No cards ready 🎉</h2><p>Add cards or change your practice count.</p><button id="goAdd">Create a card</button></div>
<div id="studyArea"><div class="meta"><span id="tag">CARD</span><span id="count"></span></div><div id="flash" class="flash"><div id="front"></div><div id="back" class="hidden"></div><small id="hint">Tap to reveal</small></div><div id="ratings" class="ratings hidden"><button data-r="again">Again<small>10 min</small></button><button data-r="hard">Hard<small>1 day</small></button><button data-r="good">Good<small>3 days</small></button><button data-r="easy">Easy<small>7 days</small></button></div></div></section>
<section id="cards" class="page hidden"><div class="head"><h2>My Cards</h2><input id="search" placeholder="Search"></div><div id="list"></div><p id="none" class="empty">No cards yet.</p></section>
<section id="add" class="page hidden"><div class="panel"><h2>Create Flashcard</h2><label>Front / Question<input id="q" placeholder="Question"></label><label>Back / Answer<textarea id="a" placeholder="Answer"></textarea></label><div class="two"><label>Deck<input id="deck" value="General"></label><label>Tag<input id="tagInput" placeholder="Polity, English..."></label></div><label><input type="checkbox" id="star"> ⭐ Important</label><button id="saveCard" class="primary">Save Card</button></div></section>
<section id="progress" class="page hidden"><div class="panel"><h2>Progress</h2><p>Mastery <b id="mastery">0%</b></p><div class="bar"><i id="bar"></i></div><div class="stats"><div><b id="total">0</b><small>Total</small></div><div><b id="reviews">0</b><small>Reviews</small></div><div><b id="important">0</b><small>Important</small></div><div><b id="sessions">0</b><small>Sessions</small></div></div></div></section>
</main><script src="app.js"></script></body></html>
